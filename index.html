<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سرحان فارم</title>
    <!-- تحميل مكتبة Three.js للرسوميات ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #87CEEB; /* لون مبدئي للسماء */
        }

        /* حاوية العرض ثلاثي الأبعاد */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* واجهة المستخدم الاحترافية (Glassmorphism) */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none; /* للسماح بالتفاعل مع الـ 3D إذا أردنا لاحقاً */
        }

        .menu-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 40px;
            width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            pointer-events: auto; /* إعادة تفعيل التفاعل للقائمة */
        }

        h1 {
            font-size: 3.5rem;
            color: #ffffff;
            margin: 0 0 30px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 2px 5px #2e8b57;
        }

        button {
            background: linear-gradient(135deg, #4caf50, #2e8b57);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 12px;
            margin: 12px auto;
            display: block;
            width: 85%;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #5ddb62, #3cb371);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hidden { display: none !important; }

        #farms-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .farm-item {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .farm-item:hover { background: rgba(46, 139, 87, 0.9); }
        
        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- حاوية الـ 3D -->
    <div id="canvas-container"></div>

    <!-- واجهة المستخدم (القائمة) -->
    <div class="ui-layer">
        <div class="menu-box" id="main-menu">
            <h1>سرحان فارم</h1>
            
            <button id="btn-continue" onclick="showSavedFarms()">استمرار</button>
            <button onclick="startNewFarm()">بدء مزرعة جديدة</button>
            <button onclick="openSettings()">الإعدادات</button>

            <!-- حاوية المزارع المحفوظة -->
            <div id="saved-farms-container" class="hidden">
                <h3 style="color: white; font-size: 1.5rem; margin-bottom: 15px;">اختر مزرعتك:</h3>
                <div id="farms-list"></div>
                <button onclick="hideSavedFarms()" style="background: #e74c3c; width: 50%; font-size: 1.1rem; padding: 10px; margin-top: 20px;">رجوع</button>
            </div>
        </div>
    </div>

    <!-- كود القائمة والـ 3D -->
    <script>
        // ==========================================
        // 1. نظام القائمة والحفظ (LocalStorage)
        // ==========================================
        let savedFarms = JSON.parse(localStorage.getItem('sarhanFarms3D')) || [];
        
        window.onload = function() {
            const btnContinue = document.getElementById('btn-continue');
            if (savedFarms.length === 0) {
                btnContinue.disabled = true;
                btnContinue.innerText = "استمرار (لا توجد مزارع)";
            }
            init3D(); // تشغيل بيئة الـ 3D
        };

        function showSavedFarms() {
            document.getElementById('btn-continue').style.display = 'none';
            document.getElementById('saved-farms-container').classList.remove('hidden');
            
            const list = document.getElementById('farms-list');
            list.innerHTML = ''; 
            
            savedFarms.forEach((farm, index) => {
                const div = document.createElement('div');
                div.className = 'farm-item';
                div.innerHTML = `🌾 ${farm.name} (المستوى: ${farm.level})`;
                div.onclick = () => loadFarm(index);
                list.appendChild(div);
            });
        }

        function hideSavedFarms() {
            document.getElementById('btn-continue').style.display = 'block';
            document.getElementById('saved-farms-container').classList.add('hidden');
        }

        function startNewFarm() {
            const farmName = prompt("أدخل اسم مزرعتك الجديدة:");
            if (farmName && farmName.trim() !== "") {
                savedFarms.push({ name: farmName, level: 1 });
                localStorage.setItem('sarhanFarms3D', JSON.stringify(savedFarms));
                location.reload(); 
            }
        }

        function loadFarm(index) {
            alert("تم الدخول إلى مزرعة: " + savedFarms[index].name + " بنجاح!");
            // هنا سيتم إخفاء القائمة وبدء اللعبة مستقبلاً
            document.getElementById('main-menu').classList.add('hidden');
        }

        function openSettings() {
            alert("جاري فتح إعدادات 'سرحان فارم'...");
        }

        // ==========================================
        // 2. بيئة الـ 3D الاحترافية (Three.js)
        // ==========================================
        function init3D() {
            const container = document.getElementById('canvas-container');

            // إعداد المشهد والكاميرا
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // سماء زرقاء
            scene.fog = new THREE.Fog(0x87ceeb, 20, 100); // ضباب للعمق

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 25); // زاوية رؤية علوية
            camera.lookAt(0, 0, 0);

            // إعداد المصيِّر (Renderer) وتفعيل الظلال
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // الإضاءة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 150;
            dirLight.shadow.camera.left = -50;
            dirLight.shadow.camera.right = 50;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            scene.add(dirLight);

            // الأرضية الـ 3D
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // الشمس
            const sunGeo = new THREE.SphereGeometry(4, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            sun.position.set(30, 30, -40);
            scene.add(sun);

            // دالة لبناء أشجار كرتونية 3D
            function createTree(x, z) {
                const treeGroup = new THREE.Group();
                
                // الجذع
                const trunkGeo = new THREE.CylinderGeometry(0.5, 0.7, 3, 8);
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 1.5;
                trunk.castShadow = true;
                trunk.receiveShadow = true;
                treeGroup.add(trunk);

                // الأوراق (شكل مخروطي كرتوني)
                const leavesGeo = new THREE.ConeGeometry(2.5, 5, 8);
                const leavesMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.y = 5.5;
                leaves.castShadow = true;
                leaves.receiveShadow = true;
                treeGroup.add(leaves);

                treeGroup.position.set(x, 0, z);
                scene.add(treeGroup);
            }

            // توزيع بعض الأشجار
            createTree(-10, -5);
            createTree(15, -15);
            createTree(8, -25);
            createTree(-20, -10);

            // بناء حيوان كرتوني (خروف 3D بسيط باستخدام المكعبات)
            const animals = [];
            function createSheep(x, z) {
                const sheepGroup = new THREE.Group();

                // الجسم (أبيض)
                const bodyGeo = new THREE.BoxGeometry(2, 1.5, 3);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1.5;
                body.castShadow = true;
                sheepGroup.add(body);

                // الرأس (أسود)
                const headGeo = new THREE.BoxGeometry(1, 1, 1.2);
                const headMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.set(0, 2.2, 1.8);
                head.castShadow = true;
                sheepGroup.add(head);

                // الأرجل (أسود)
                const legGeo = new THREE.BoxGeometry(0.4, 1, 0.4);
                const legPositions = [
                    [-0.7, 0.5, 1], [0.7, 0.5, 1],
                    [-0.7, 0.5, -1], [0.7, 0.5, -1]
                ];
                legPositions.forEach(pos => {
                    const leg = new THREE.Mesh(legGeo, headMat);
                    leg.position.set(pos[0], pos[1], pos[2]);
                    leg.castShadow = true;
                    sheepGroup.add(leg);
                });

                sheepGroup.position.set(x, 0, z);
                scene.add(sheepGroup);
                return sheepGroup;
            }

            const sheep1 = createSheep(-15, 5);
            sheep1.rotation.y = Math.PI / 2; // توجيه الخروف
            animals.push(sheep1);

            const sheep2 = createSheep(-25, 0);
            sheep2.rotation.y = Math.PI / 2.2;
            animals.push(sheep2);

            // سحب كرتونية 3D
            const clouds = [];
            function createCloud(x, y, z) {
                const cloudGroup = new THREE.Group();
                const geo = new THREE.SphereGeometry(2, 16, 16);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
                
                const p1 = new THREE.Mesh(geo, mat);
                const p2 = new THREE.Mesh(geo, mat); p2.position.set(2, 0, 0); p2.scale.set(1.2, 1.2, 1.2);
                const p3 = new THREE.Mesh(geo, mat); p3.position.set(4, 0, 0);
                const p4 = new THREE.Mesh(geo, mat); p4.position.set(2, 1.5, 0);

                cloudGroup.add(p1, p2, p3, p4);
                cloudGroup.position.set(x, y, z);
                scene.add(cloudGroup);
                return cloudGroup;
            }

            clouds.push(createCloud(-20, 20, -30));
            clouds.push(createCloud(10, 25, -40));

            // تعديل الحجم عند تغيير أبعاد النافذة
            window.addEventListener('resize', onWindowResize, false);
            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // حلقة التحريك (Animation Loop)
            function animate() {
                requestAnimationFrame(animate);

                // تحريك السحب
                clouds.forEach(cloud => {
                    cloud.position.x += 0.02;
                    if (cloud.position.x > 40) cloud.position.x = -40;
                });

                // تحريك الخرفان (مشي بسيط)
                animals.forEach((animal, index) => {
                    animal.position.x += 0.03 + (index * 0.01);
                    // حركة القفز الخفيفة للمشي
                    animal.position.y = Math.abs(Math.sin(Date.now() * 0.005)) * 0.2;
                    if (animal.position.x > 30) animal.position.x = -30;
                });

                // تحريك الكاميرا ببطء شديد لإعطاء حيوية للمشهد
                camera.position.x = Math.sin(Date.now() * 0.0002) * 5;
                camera.lookAt(0, 0, 0);

                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
