<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حرب الفضاء - القائمة الرئيسية</title>
    <style>
        :root {
            --bg-color: rgba(15, 23, 42, 0.85);
            --text-color: #ffffff;
            --btn-bg: #3b82f6;
            --btn-hover: #2563eb;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* متغيرات الوضع الفاتح (Light Mode) في حال تفعيله */
        body.light-mode {
            --bg-color: rgba(255, 255, 255, 0.85);
            --text-color: #1e293b;
            --btn-bg: #ef4444;
            --btn-hover: #dc2626;
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        canvas { display: block; }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .menu-container {
            background: var(--bg-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            width: 350px;
            display: none; /* يتم التحكم بالظهور عبر جافاسكريبت */
            animation: fadeIn 0.4s ease-out;
        }

        .menu-container.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { margin-top: 0; font-size: 2.5em; margin-bottom: 30px; }
        h2 { margin-top: 0; font-size: 1.8em; margin-bottom: 20px; }

        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: var(--btn-bg);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--btn-hover);
            transform: scale(1.02);
        }

        .secondary-btn { background-color: transparent; border: 2px solid var(--btn-bg); color: var(--text-color); }
        .secondary-btn:hover { background-color: var(--btn-bg); color: #fff; }

        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        select {
            padding: 8px;
            border-radius: 5px;
            background: rgba(255,255,255,0.1);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
        }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--btn-bg); }
        input:checked + .slider:before { transform: translateX(26px); }

    </style>
</head>
<body>

<!-- واجهة المستخدم (القوائم) -->
<div id="ui-layer">
    
    <!-- القائمة الرئيسية -->
    <div id="main-menu" class="menu-container active">
        <h1>حرب الفضاء</h1>
        <button onclick="showMenu('game-ui')">ابدأ اللعب (فردي)</button>
        <button onclick="showMenu('room-menu')">صمم غرفة (لعب جماعي)</button>
        <button class="secondary-btn" onclick="showMenu('settings-menu')">الإعدادات</button>
    </div>

    <!-- قائمة الغرفة (Lobby) -->
    <div id="room-menu" class="menu-container">
        <h2>غرفة العمليات</h2>
        <p>كود الغرفة: <strong style="color: #fbbf24;">X7-90A</strong></p>
        <div style="margin: 20px 0; text-align: right; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
            <p>اللاعبين المتصلين:</p>
            <ul style="list-style: none; padding: 0; margin: 0;">
                <li>🟢 أنت (القائد) - طائرة هجومية</li>
                <li>🟡 في انتظار الأصدقاء...</li>
            </ul>
        </div>
        <button style="background: #10b981;" onclick="alert('بدء اللعب الجماعي!')">بدء المعركة</button>
        <button class="secondary-btn" onclick="showMenu('main-menu')">عودة</button>
    </div>

    <!-- قائمة الإعدادات -->
    <div id="settings-menu" class="menu-container">
        <h2>الإعدادات</h2>
        
        <div class="setting-group">
            <span>اللغة (Language)</span>
            <select>
                <option>العربية</option>
                <option>English</option>
            </select>
        </div>
        
        <div class="setting-group">
            <span>الموسيقى</span>
            <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>

        <div class="setting-group">
            <span>المؤثرات الصوتية</span>
            <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>

        <div class="setting-group">
            <span>الوضع الليلي (Dark Mode)</span>
            <label class="switch"><input type="checkbox" id="darkModeToggle" checked onchange="toggleDarkMode()"><span class="slider"></span></label>
        </div>

        <button class="secondary-btn" onclick="showMenu('main-menu')">حفظ وعودة</button>
    </div>

</div>

<!-- استدعاء مكتبة Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // --- منطق واجهة المستخدم (التبديل بين القوائم) ---
    function showMenu(menuId) {
        document.querySelectorAll('.menu-container').forEach(el => el.classList.remove('active'));
        if (menuId !== 'game-ui') {
            document.getElementById(menuId).classList.add('active');
        } else {
            alert('سيتم إخفاء القائمة وبدء التحكم بالطائرة هنا!');
        }
    }

    function toggleDarkMode() {
        const isDark = document.getElementById('darkModeToggle').checked;
        if (isDark) {
            document.body.classList.remove('light-mode');
        } else {
            document.body.classList.add('light-mode');
        }
    }

    // --- إعداد مشهد Three.js (الفضاء والطائرة) ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.002); // ضباب فضائي لإخفاء نهاية النجوم

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 12); // الكاميرا خلف وأعلى الطائرة
    camera.lookAt(0, 0, -10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050510); // لون خلفية فضاء عميق
    document.body.appendChild(renderer.domElement);

    // إضاءة
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0x00d4ff, 2, 50);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // 1. بناء مقاتلة فضائية (انسيابية ومختلفة عن السابقة)
    const spaceship = new THREE.Group();

    // جسم المقاتلة (مخروط مسطح)
    const bodyGeo = new THREE.ConeGeometry(1, 6, 4);
    bodyGeo.rotateX(Math.PI / 2);
    bodyGeo.rotateY(Math.PI / 4); // لجعل الزوايا تبدو انسيابية
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.scale.set(1, 0.5, 1);
    spaceship.add(body);

    // الأجنحة (شكل مثلثي مسحوب للخلف)
    const wingGeo = new THREE.ConeGeometry(3, 4, 3);
    wingGeo.rotateX(Math.PI / 2);
    const wingMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.3 });
    const wings = new THREE.Mesh(wingGeo, wingMat);
    wings.position.set(0, -0.2, 1);
    wings.scale.set(1, 0.1, 1);
    spaceship.add(wings);

    // قمرة القيادة (زجاج مشع)
    const cockpitGeo = new THREE.CapsuleGeometry(0.3, 1.5, 4, 8);
    cockpitGeo.rotateX(Math.PI / 2);
    const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x00d4ff, emissive: 0x0055ff, transparent: true, opacity: 0.9 });
    const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
    cockpit.position.set(0, 0.4, -0.5);
    spaceship.add(cockpit);

    // محركات مشعة في الخلف
    const engineGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.5, 16);
    engineGeo.rotateX(Math.PI / 2);
    const engineMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff5500, emissiveIntensity: 2 });
    const engine1 = new THREE.Mesh(engineGeo, engineMat);
    engine1.position.set(0.6, -0.1, 3);
    const engine2 = engine1.clone();
    engine2.position.set(-0.6, -0.1, 3);
    spaceship.add(engine1);
    spaceship.add(engine2);

    scene.add(spaceship);

    // 2. نظام النجوم (لإعطاء إحساس بالسرعة والانطلاق للأمام)
    const starCount = 2000;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for(let i=0; i < starCount * 3; i++) {
        starPos[i] = (Math.random() - 0.5) * 200; // توزيع عشوائي في مساحة واسعة
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.8 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // 3. حلقة التحريك (الأنيميشن)
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        // حركة طفو المقاتلة في القائمة
        spaceship.position.y = Math.sin(time * 1.5) * 0.3;
        spaceship.rotation.z = Math.sin(time * 0.8) * 0.05; // تمايل الأجنحة
        spaceship.rotation.x = Math.sin(time) * 0.02;

        // تحريك النجوم نحوك لإعطاء إحساس بالسرعة
        const positions = stars.geometry.attributes.position.array;
        for(let i=2; i < starCount * 3; i+=3) {
            positions[i] += 0.5; // سرعة تقدم النجوم
            if(positions[i] > 20) {
                positions[i] = -200; // إعادة النجم للخلف بمجرد مروره
            }
        }
        stars.geometry.attributes.position.needsUpdate = true;

        // تأثير وميض المحركات
        engineMat.emissiveIntensity = 1 + Math.sin(time * 20) * 0.5;

        renderer.render(scene, camera);
    }

    animate();

    // تجاوب الشاشة
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
