<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تفكيك القنابل</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: white; margin: 0; padding: 0; overflow: hidden; }
        .hidden { display: none !important; }
        #start-screen, #settings-screen, #modes-menu { padding: 50px; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #2c3e50; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 5px; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        input { padding: 15px; font-size: 18px; margin: 10px; width: 250px; border-radius: 5px; border: none; }
        #game-room { width: 100vw; height: 100vh; position: relative; }
        #viewport-3d { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #header-bar { position: absolute; top: 10px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 24px; pointer-events: none; z-index: 5; color: #fff; }
        #ui-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; flex-direction: column; align-items: center; }
        #game-chat { background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 5px; margin-bottom: 10px; min-width: 200px; min-height: 50px; }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>لعبة الأبطال: الأعمى والأصم والأبكم</h1>
        <button id="create-room-btn">إنشاء غرفة</button>
        <button id="join-room-btn">الدخول لغرفة</button>
        <input type="text" id="room-code-input" placeholder="رمز الغرفة">
        <input type="text" id="password-input" placeholder="كلمة السر">
        <button id="settings-btn">الإعدادات</button>
    </div>

    <div id="settings-screen" class="hidden">
        <h2>الإعدادات</h2>
        <label>اللغة:
            <select id="lang-select">
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </label>
        <br>
        <label>الموسيقى: <input type="checkbox" id="music-toggle" checked></label>
        <br>
        <label>الأصوات: <input type="checkbox" id="sound-toggle" checked></label>
        <button id="back-to-start">رجوع</button>
    </div>

    <div id="game-room" class="hidden">
        <div id="header-bar">
            <span>دورك: <span id="role-name"></span></span>
            <span id="timer">05:00</span>
            <span>المستوى: <span id="level-num">1</span></span>
        </div>
        <div id="viewport-3d"></div>
        <div id="ui-overlay">
            <button id="mic-toggle">إيقاف الميكروفون</button>
            <div id="game-chat"></div>
        </div>
        
        <div id="modes-menu" class="hidden">
            <h3>اختر طور اللعبة</h3>
            <button id="story-mode">طور القصة</button>
            <button id="infinite-mode">الطور اللانهائي</button>
            <button id="custom-mode">الطور المخصص</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="background-music.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const startScreen = document.getElementById('start-screen');
        const settingsScreen = document.getElementById('settings-screen');
        const gameRoom = document.getElementById('game-room');
        const modesMenu = document.getElementById('modes-menu');
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        
        document.getElementById('settings-btn').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            settingsScreen.classList.remove('hidden');
        });

        document.getElementById('back-to-start').addEventListener('click', () => {
            settingsScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });

        musicToggle.addEventListener('change', () => {
            if (musicToggle.checked) bgMusic.play();
            else bgMusic.pause();
        });

        function startGameRoom() {
            startScreen.classList.add('hidden');
            settingsScreen.classList.add('hidden');
            modesMenu.classList.remove('hidden');
            gameRoom.classList.remove('hidden');
            if (!musicToggle.checked) bgMusic.pause();
        }

        function startActualGame() {
            modesMenu.classList.add('hidden');
            initThreeJS();
            startTimer();
        }

        document.getElementById('join-room-btn').addEventListener('click', startGameRoom);
        document.getElementById('story-mode').addEventListener('click', startActualGame);
        document.getElementById('infinite-mode').addEventListener('click', startActualGame);
        document.getElementById('custom-mode').addEventListener('click', startActualGame);

        let localStream;
        let renderer, scene, camera;
        const roleName = document.getElementById('role-name');
        const micToggle = document.getElementById('mic-toggle');

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('viewport-3d').appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            camera.position.z = 5;

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();
        }

        async function assignRole(role) {
            roleName.innerText = role;
            if (role === 'الأصم') {
                if (localStream) localStream.getAudioTracks()[0].enabled = false;
            }
        }

        async function enableMicrophone() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) {
                console.error("خطأ في الميكروفون:", err);
            }
        }

        micToggle.addEventListener('click', () => {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                micToggle.innerText = audioTrack.enabled ? "إيقاف الميكروفون" : "تشغيل الميكروفون";
            }
        });

        setTimeout(() => {
            assignRole('الأعمى');
            enableMicrophone();
        }, 2000);

        let timerInterval;
        function startTimer() {
            let timerDisplay = document.getElementById('timer');
            let duration = 300;
            timerInterval = setInterval(() => {
                let minutes = parseInt(duration / 60, 10);
                let seconds = parseInt(duration % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                timerDisplay.textContent = minutes + ":" + seconds;
                if (--duration < 0) {
                    clearInterval(timerInterval);
                    alert("انتهى الوقت! انفجرت القنبلة.");
                }
            }, 1000);
        }

        const GameManager = {
            currentLevel: 1,
            generatePuzzle: function() {
                if (this.currentLevel <= 10) console.log("لغز القصة: قطع السلك.");
                else if (this.currentLevel <= 20) console.log("لغز رياضي.");
                else console.log("لغز لوحة المفاتيح.");
            }
        };
        GameManager.generatePuzzle();
    </script>
</body>
</html>
