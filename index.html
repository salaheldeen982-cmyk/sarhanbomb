<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزرعة السرحان</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        /* تصميم الخلفية المتحركة */
        .farm-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* سماء زرقاء، أرض ترابية، وعشب أخضر */
            background: linear-gradient(to bottom, #87CEEB 45%, #8B4513 45%, #228B22 50%);
            z-index: -1;
        }
        .sun {
            position: absolute;
            top: 10%; right: 10%;
            width: 100px; height: 100px;
            background-color: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 50px #FFD700;
            animation: pulse 3s infinite alternate;
        }
        .cloud {
            position: absolute;
            font-size: 5rem;
            animation: moveClouds 25s linear infinite;
        }
        .cloud1 { top: 5%; left: -10%; }
        .cloud2 { top: 15%; left: -30%; animation-duration: 35s; }
        .animals {
            position: absolute;
            bottom: 25%;
            width: 100%;
            font-size: 4rem;
            white-space: nowrap;
            animation: moveAnimals 20s linear infinite;
        }

        /* حركات الأنيميشن */
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        @keyframes moveClouds {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-20vw); }
        }
        @keyframes moveAnimals {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100vw); }
        }

        /* تصميم واجهة المستخدم (القائمة) */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            width: 450px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        h1 {
            color: #2e8b57;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        button {
            background-color: #8B4513;
            color: white;
            border: 2px solid #5C3A21;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 85%;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #A0522D;
            transform: scale(1.05);
        }
        button:disabled {
            background-color: #999;
            border-color: #777;
            cursor: not-allowed;
            transform: none;
        }
        
        .hidden { display: none; }
        
        #farms-list {
            margin-top: 15px;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
        }
        .farm-item {
            background: #2e8b57;
            color: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s;
        }
        .farm-item:hover { background: #3cb371; }
    </style>
</head>
<body>

    <!-- الخلفية المتحركة (شمس، سحاب، حيوانات وجرار) -->
    <div class="farm-bg">
        <div class="sun"></div>
        <div class="cloud cloud1">☁️</div>
        <div class="cloud cloud2">☁️</div>
        <div class="animals">🐄 🐑 🐓 🚜 🐎</div>
    </div>

    <!-- قائمة البداية -->
    <div class="menu-container" id="main-menu">
        <h1>مزرعة السرحان</h1>
        
        <button id="btn-continue" onclick="showSavedFarms()">استمرار</button>
        <button onclick="startNewFarm()">بدء مزرعة جديدة</button>
        <button onclick="alert('جاري فتح الإعدادات...')">الإعدادات</button>

        <!-- قائمة المزارع المحفوظة (تظهر عند الضغط على استمرار) -->
        <div id="saved-farms-container" class="hidden">
            <h3 style="color: #8B4513;">اختر مزرعتك:</h3>
            <div id="farms-list"></div>
            <button onclick="hideSavedFarms()" style="background-color: #555; width: 50%; margin-top: 15px;">رجوع</button>
        </div>
    </div>

    <script>
        // استخدام التخزين المحلي (localStorage) لحفظ المزارع حتى لو قفلت الصفحة
        let savedFarms = JSON.parse(localStorage.getItem('sarhanFarms')) || [];
        
        // عند تحميل الصفحة، نتحقق إذا كان هناك مزارع سابقة
        window.onload = function() {
            if (savedFarms.length === 0) {
                // إذا لم يكن هناك مزارع، نقوم بتعطيل زر الاستمرار
                document.getElementById('btn-continue').disabled = true;
                document.getElementById('btn-continue').innerText = "استمرار (لا توجد مزارع)";
            }
        };

        // عرض قائمة المزارع عند الضغط على "استمرار"
        function showSavedFarms() {
            document.getElementById('btn-continue').style.display = 'none';
            document.getElementById('saved-farms-container').classList.remove('hidden');
            
            const list = document.getElementById('farms-list');
            list.innerHTML = ''; // مسح القائمة القديمة
            
            savedFarms.forEach((farm, index) => {
                const div = document.createElement('div');
                div.className = 'farm-item';
                div.innerText = farm.name + ' (المستوى: ' + farm.level + ')';
                div.onclick = () => loadFarm(index);
                list.appendChild(div);
            });
        }

        // إخفاء القائمة والرجوع للشاشة الرئيسية
        function hideSavedFarms() {
            document.getElementById('btn-continue').style.display = 'inline-block';
            document.getElementById('saved-farms-container').classList.add('hidden');
        }

        // إنشاء مزرعة جديدة
        function startNewFarm() {
            const farmName = prompt("أدخل اسم مزرعتك الجديدة:");
            if (farmName) {
                const newFarm = { name: farmName, level: 1 };
                savedFarms.push(newFarm);
                localStorage.setItem('sarhanFarms', JSON.stringify(savedFarms));
                alert("تم إنشاء مزرعة '" + farmName + "' بنجاح!");
                location.reload(); // تحديث الصفحة لتفعيل زر الاستمرار
            }
        }

        // الدخول إلى المزرعة المختارة (هنا سنضع كود اللعبة الفعلي لاحقاً)
        function loadFarm(index) {
            alert("جاري تحميل مزرعة: " + savedFarms[index].name + " ... (هنا سيتم فتح شاشة اللعبة)");
        }
    </script>
</body>
</html>
