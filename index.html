<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قائمة البداية - لعبة الطائرات</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; /* لمنع ظهور أشرطة التمرير */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        canvas { 
            display: block; 
        }
        /* تصميم قائمة واجهة المستخدم */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* للسماح بالضغط على المشهد 3D إذا أردنا لاحقاً */
        }
        .menu-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            pointer-events: auto; /* تفعيل الضغط على القائمة فقط */
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }
        h1 { 
            margin-top: 0; 
            font-size: 3em; 
            text-shadow: 2px 2px 4px #000; 
        }
        button {
            padding: 15px 40px;
            font-size: 1.5em;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<!-- واجهة المستخدم (قائمة البداية) -->
<div id="ui-container">
    <div class="menu-box">
        <h1>حرب الطائرات</h1>
        <button id="startBtn">ابدأ اللعب</button>
    </div>
</div>

<!-- استدعاء مكتبة Three.js من خوادم CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // 1. إعداد المشهد (Scene) والكاميرا (Camera) والمُصيّر (Renderer)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // لون سماء أزرق فاتح
    scene.fog = new THREE.Fog(0x87CEEB, 10, 50); // ضباب لدمج الأفق

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    // ضبط موقع الكاميرا لتصوير الطائرة من زاوية مميزة
    camera.position.set(5, 5, 12);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. إضافة الإضاءة
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 10, 10);
    scene.add(dirLight);

    // 3. بناء طائرة 3D بسيطة (للتجربة)
    const airplane = new THREE.Group();

    // هيكل الطائرة الرئيسي
    const bodyGeom = new THREE.BoxGeometry(2, 2, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222 }); // لون رمادي غامق
    const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
    airplane.add(bodyMesh);

    // الأجنحة
    const wingGeom = new THREE.BoxGeometry(10, 0.2, 2);
    const wingMat = new THREE.MeshStandardMaterial({ color: 0xcc0000 }); // لون أحمر
    const wingMesh = new THREE.Mesh(wingGeom, wingMat);
    wingMesh.position.set(0, 0, 0);
    airplane.add(wingMesh);

    // ذيل الطائرة
    const tailGeom = new THREE.BoxGeometry(3, 2, 1);
    const tailMesh = new THREE.Mesh(tailGeom, wingMat);
    tailMesh.position.set(0, 1, -3.5);
    airplane.add(tailMesh);

    scene.add(airplane);

    // 4. نظام الدخان (Particles)
    const smokeParticles = [];
    // شكل الجزيء الواحد عبارة عن كرة صغيرة
    const smokeGeometry = new THREE.SphereGeometry(0.4, 8, 8);
    const smokeMaterial = new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.8 });

    function createSmoke() {
        const particle = new THREE.Mesh(smokeGeometry, smokeMaterial.clone());
        
        // موضع خروج الدخان (خلف الطائرة)
        particle.position.set(
            airplane.position.x + (Math.random() - 0.5) * 0.5,
            airplane.position.y + (Math.random() - 0.5) * 0.5,
            airplane.position.z - 4.5 // للخلف
        );
        
        // سرعة واتجاه وعمر الدخان
        particle.userData = {
            life: 1.0,
            velocity: new THREE.Vector3((Math.random() - 0.5) * 0.2, Math.random() * 0.1, -0.2 - Math.random() * 0.2), // يتجه للخلف والأعلى
            scaleSpeed: 1.02 + Math.random() * 0.03 // يكبر حجمه مع الوقت
        };
        scene.add(particle);
        smokeParticles.push(particle);
    }

    // 5. حلقة التحريك (Animation Loop)
    let clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        let time = clock.getElapsedTime();

        // حركة بطيئة للطائرة لتبدو وكأنها تحلق ببطء في القائمة الرئيسية
        airplane.position.y = Math.sin(time * 2) * 0.5;
        airplane.rotation.z = Math.sin(time) * 0.1; // تمايل الأجنحة
        airplane.rotation.x = Math.sin(time * 1.5) * 0.05; // تمايل الهيكل

        // إنشاء جزيئات دخان جديدة في كل إطار
        createSmoke();

        // تحديث جزيئات الدخان الموجودة (تحريك، تكبير، إخفاء)
        for (let i = smokeParticles.length - 1; i >= 0; i--) {
            let p = smokeParticles[i];
            p.position.add(p.userData.velocity); // تحريك الجزيء
            p.scale.multiplyScalar(p.userData.scaleSpeed); // تكبير حجمه
            p.material.opacity -= 0.015; // تقليل الشفافية ليتلاشى
            p.userData.life -= 0.015;

            // إزالة الجزيء من المشهد والذاكرة بعد موته
            if (p.userData.life <= 0) {
                scene.remove(p);
                p.material.dispose();
                smokeParticles.splice(i, 1);
            }
        }

        renderer.render(scene, camera);
    }

    animate(); // بدء التحريك

    // تجاوب الكاميرا مع تغيير حجم النافذة
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. التعامل مع زر "ابدأ اللعب"
    document.getElementById('startBtn').addEventListener('click', () => {
        // يمكنك هنا إخفاء القائمة (ui-container) والانتقال للعبة الفعلية
        document.getElementById('ui-container').style.display = 'none';
        alert('هنا سنبدأ بكتابة كود اللعبة والقتال ضد الطائرة الأخرى!');
    });
</script>
</body>
</html>
